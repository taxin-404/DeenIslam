      { id: 'pDnDbOZ8Xhs', title: 'আলোচনা ও বয়ান - পর্ব ৯২', category: 'lecture' },
      { id: '0BtiIFHD0_s', title: 'আলোচনা ও বয়ান - পর্ব ৯৩', category: 'lecture' },
      { id: '2q98Vw3J_7I', title: 'আলোচনা ও বয়ান - পর্ব ৯৪', category: 'lecture' },
      { id: 'CMvkgt0JDiw', title: 'আলোচনা ও বয়ান - পর্ব ৯৫', category: 'lecture' },
      { id: 'kqftOcEcn_4', title: 'আলোচনা ও বয়ান - পর্ব ৯৬', category: 'lecture' },
      { id: 'LRsKMxownrU', title: 'আলোচনা ও বয়ান - পর্ব ৯৭', category: 'lecture' },
      { id: 'uA2dB2Ty2sU', title: 'আলোচনা ও বয়ান - পর্ব ৯৮', category: 'lecture' },
      { id: 'xJr8n77CkEw', title: 'আলোচনা ও বয়ান - পর্ব ৯৯', category: 'lecture' }
    ];

    const grid = document.getElementById('media-grid');
    const paginationContainer = document.getElementById('pagination-container');
    const modal = document.getElementById('video-modal');
    const modalIframe = document.getElementById('modal-iframe');
    const modalContent = document.getElementById('modal-content');
    const searchInput = document.getElementById('media-search');

    let currentPage = 1;
    const itemsPerPage = 12;
    let filteredItems = [...lectureVideos];

    function renderMedia() {
      grid.innerHTML = '';

      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const paginatedItems = filteredItems.slice(startIndex, endIndex);

      if (paginatedItems.length === 0) {
        document.getElementById('empty-state').classList.remove('hidden');
        paginationContainer.innerHTML = '';
        return;
      }
      document.getElementById('empty-state').classList.add('hidden');

      paginatedItems.forEach((item) => {
        const thumbUrl = `https://img.youtube.com/vi/${item.id}/hqdefault.jpg`;
        const card = document.createElement('div');
        card.className = "video-card-hover bg-white dark:bg-slate-900 rounded-[2rem] overflow-hidden shadow-sm border border-slate-100 dark:border-slate-800 group cursor-pointer";
        card.onclick = () => openModal(item);
        card.innerHTML = `
          <div class="aspect-video relative overflow-hidden">
            <img src="${thumbUrl}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
              <div class="w-14 h-14 bg-primary text-white rounded-full flex items-center justify-center shadow-2xl transform scale-75 group-hover:scale-100 transition-transform duration-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </div>
            </div>
            <div class="absolute top-4 left-4 flex flex-col space-y-2">
              <span class="px-3 py-1.5 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md text-[10px] font-bold text-primary rounded-lg uppercase tracking-wider shadow-sm border border-emerald-50 dark:border-slate-800">আলোচনা ও বয়ান</span>
            </div>
            <div class="absolute top-4 right-4">
              <button onclick="handleMediaBookmark(event, ${JSON.stringify(item).replace(/"/g, '&quot;')})" class="w-10 h-10 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md text-primary rounded-xl flex items-center justify-center shadow-sm border border-emerald-50 dark:border-slate-800 hover:bg-primary hover:text-white transition-all bookmark-btn" data-key="media_${item.id}">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="${window.isBookmarked(`media_${item.id}`) ? 'currentColor' : 'none'}" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg>
              </button>
            </div>
          </div>
          <div class="p-6">
            <h3 class="font-bold text-slate-800 dark:text-white text-sm md:text-base line-clamp-2 leading-relaxed group-hover:text-primary transition-colors">${item.title}</h3>
            <div class="flex items-center justify-between mt-4">
              <span class="text-slate-400 text-[10px] font-bold uppercase tracking-widest flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                এখন দেখুন
              </span>
              <div class="w-8 h-8 rounded-full bg-slate-50 dark:bg-slate-800 flex items-center justify-center text-slate-400 group-hover:bg-primary/10 group-hover:text-primary transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" /></svg>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      renderPagination();
    }

    function renderPagination() {
      paginationContainer.innerHTML = '';
      const totalPages = Math.ceil(filteredItems.length / itemsPerPage);
      if (totalPages <= 1) return;
      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.innerText = window.toBengaliNumerals ? window.toBengaliNumerals(i) : i;
        btn.className = `w-12 h-12 rounded-2xl font-bold transition-all duration-300 ${currentPage === i ? 'bg-primary text-white shadow-lg shadow-primary/30 scale-110' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 border border-slate-100 dark:border-slate-800'}`;
        btn.onclick = () => { currentPage = i; renderMedia(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
        paginationContainer.appendChild(btn);
      }
    }

    function openModal(item) {
      modalIframe.src = `https://www.youtube.com/embed/${item.id}?autoplay=1`;
      document.getElementById('modal-title').innerText = item.title;
      document.getElementById('modal-category').innerText = 'আলোচনা ও বয়ান';
      modal.classList.remove('pointer-events-none', 'opacity-0');
      modal.classList.add('opacity-100');
      modalContent.classList.remove('scale-95');
      modalContent.classList.add('scale-100');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('opacity-100');
      modal.classList.add('opacity-0', 'pointer-events-none');
      modalContent.classList.add('scale-95');
      modalContent.classList.remove('scale-100');
      setTimeout(() => { modalIframe.src = ''; }, 300);
      document.body.style.overflow = '';
    }

    function applyFilters() {
      const query = searchInput.value.toLowerCase().trim();
      filteredItems = lectureVideos.filter(item => item.title.toLowerCase().includes(query));
      currentPage = 1;
      renderMedia();
    }

    function resetFilters() {
      searchInput.value = '';
      applyFilters();
    }

    searchInput.addEventListener('input', applyFilters);

    window.handleMediaBookmark = (event, item) => {
      event.preventDefault();
      event.stopPropagation();
      const key = `media_${item.id}`;
      const data = { key: key, type: 'media', id: item.id, title: item.title, url: `lectures.html?id=${item.id}` };
      const isAdded = window.toggleBookmark(data);
      document.querySelectorAll(`.bookmark-btn[data-key="${key}"]`).forEach(btn => {
        const svg = btn.querySelector('svg');
        svg.setAttribute('fill', isAdded ? 'currentColor' : 'none');
      });
    };

    renderMedia();
  </script>
</body>
</html>
