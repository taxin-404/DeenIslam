<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মুসলিম কমিউনিটি ও ফোরাম - DeenIslam</title>
  <link rel="icon" type="image/x-icon" href="favicon/deenislam.ico">
  <meta name="description" content="দ্বীনি আলোচনার একটি সুন্দর প্লাটফর্ম। শীঘ্রই আসছে! আমাদের কমিউনিটিতে যোগ দিন।">
  <meta name="keywords" content="ইসলামিক কমিউনিটি, ফোরাম, দ্বীনি আলোচনা, DeenIslam Community">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#059669', // Emerald 600
            secondary: '#d97706', // Amber 600
          },
          fontFamily: {
            bengali: ['Noto Sans Bengali', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen font-bengali">

  <!-- Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Main Content -->
  <main class="container mx-auto px-6 py-12 flex-grow">
    <div class="text-center mb-16">
      <h1 class="text-4xl font-extrabold text-slate-800 mb-4 tracking-tight">মুসলিম কমিউনিটি ও ফোরাম</h1>
      <p class="text-slate-600 max-w-2xl mx-auto italic">দ্বীনি আলোচনার একটি সুন্দর প্লাটফর্ম। শীঘ্রই আসছে!</p>
      <div class="w-24 h-1.5 bg-primary mx-auto rounded-full mt-6"></div>
    </div>
    
    <div class="bg-white p-10 md:p-20 rounded-[3rem] shadow-xl border border-emerald-50 text-center max-w-5xl mx-auto relative overflow-hidden">
      
      <div class="relative z-10">
        <h2 class="text-4xl font-bold mb-6 text-slate-800">উন্নয়নাধীন রয়েছে!</h2>
        <p class="text-slate-500 text-lg leading-relaxed mb-12 max-w-2xl mx-auto">আমরা একটি আধুনিক কমিউনিটি ফোরাম তৈরি করছি যেখানে আপনি আপনার দ্বীনি প্রশ্ন করতে পারবেন এবং অভিজ্ঞদের কাছ থেকে দিকনির্দেশনা পেতে পারবেন।</p>
        
        <div class="bg-emerald-50 p-10 rounded-3xl border border-emerald-100 max-w-2xl mx-auto">
          <label class="block text-slate-700 font-bold text-lg mb-4 text-left">আমাদের নিউজলেটারে যোগ দিন:</label>
          <div class="flex flex-col md:flex-row gap-4">
            <input type="email" placeholder="আপনার ইমেল লিখুন" class="p-4 rounded-2xl border border-slate-200 w-full focus:outline-none focus:ring-4 focus:ring-emerald-200 transition-all">
            <button class="bg-primary text-white px-10 py-4 rounded-2xl font-bold hover:bg-emerald-700 shadow-lg shadow-emerald-200 transition-all whitespace-nowrap">সাবস্ক্রাইব করুন</button>
          </div>
        </div>

        <div class="mt-16 flex justify-center">
          <a href="https://www.facebook.com/groups/deenislam.org/" target="_blank" rel="noopener noreferrer" class="bg-[#1877F2] text-white px-8 py-4 rounded-2xl font-bold hover:bg-[#166fe5] shadow-lg shadow-blue-200 transition-all flex items-center space-x-3 transform hover:-translate-y-1">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-0.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            <span>ফেসবুক কমিউনিটিতে যোগ দিন</span>
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <script src="js/components.js"></script>
</body>
</html>
